version: 2

models:
  - name: dim_customers
    description: "Customer dimension table containing profile details, lifetime metrics, and recency-based status."
    columns:
      - name: customer_id
        description: "Unique primary key for each customer."
        data_tests:
          - unique
          - not_null
      - name: company_name
        description: "Company name of the customer."
      - name: signup_date
        description: "Account creation date."
      - name: plan_tier
        description: "Current active plan tier."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Basic', 'Pro', 'Enterprise']
      - name: total_subscriptions
        description: "Total count of subscriptions held."
      - name: lifetime_amount_due
        description: "Total lifetime billed amount."
      - name: lifetime_amount_paid
        description: "Total lifetime paid amount."
      - name: outstanding_balance
        description: "Current outstanding balance across all accounts."
      - name: most_recent_payment_date
        description: "The date of the most recent payment received from the customer."
      - name: customer_status
        description: "Lifecycle status as of the as_of_date: active (a subscription is running), churned (had subscriptions, none running), prospect (never subscribed)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'churned', 'prospect']

  - name: fct_invoices
    description: "Invoice fact table capturing transactional billing, balances, and collection statuses."
    columns:
      - name: invoice_id
        description: "Unique identifier for each invoice."
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        description: "Foreign key linking the invoice to its parent subscription."
        data_tests:
          - not_null
      - name: customer_id
        description: "Foreign key linking the invoice to the customer dimension table."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: company_name
        description: "Customer company name associated with the invoice."
      - name: plan_tier
        description: "Plan tier at the time of invoicing."
      - name: amount_due
        description: "Total billed amount for the invoice."
      - name: amount_paid
        description: "Amount successfully collected."
      - name: unpaid_balance
        description: "Remaining balance on the specific invoice."
      - name: payment_status
        description: "Collection classification."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid', 'partial', 'unpaid']

  - name: fct_mrr_monthly
    description: "One row per customer per month, from the customer's first paid month to the as_of_date. Month-end MRR and the movement that explains the change from the previous month."
    columns:
      - name: customer_id
        description: "Foreign key to dim_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: month_start_date
        description: "First day of the month."
        data_tests:
          - not_null
      - name: month_end_date
        description: "Last day of the month. MRR is measured on this day."
      - name: mrr
        description: "Monthly recurring revenue from subscriptions active on month_end_date."
        data_tests:
          - not_null
      - name: previous_mrr
        description: "MRR in the previous month (0 in a customer's first month)."
      - name: new_mrr
        description: "MRR from a customer paying for the first time."
      - name: reactivation_mrr
        description: "MRR from a customer who paid before, stopped, and came back."
      - name: expansion_mrr
        description: "Increase in MRR from a customer who paid in both months."
      - name: contraction_mrr
        description: "Decrease in MRR from a customer who still pays."
      - name: churned_mrr
        description: "Last month's MRR from a customer whose MRR dropped to 0."
      - name: is_paying
        description: "True when the customer has MRR above 0 in the month."

  - name: rpt_saas_metrics_monthly
    description: "One row per month with the main SaaS metrics: MRR, ARR, customers, MRR movements, retention and churn. Built from fct_mrr_monthly. Retention and churn rates are ratios, so 1.0 means 100%."
    columns:
      - name: month_start_date
        description: "First day of the month."
        data_tests:
          - unique
          - not_null
      - name: mrr
        description: "Monthly recurring revenue at the end of the month."
        data_tests:
          - not_null
      - name: arr
        description: "Annual recurring revenue (MRR x 12)."
      - name: paying_customers
        description: "Customers with MRR above 0 at the end of the month."
        data_tests:
          - not_null
      - name: arpa
        description: "Average revenue per paying customer (MRR / paying customers)."
      - name: new_mrr
        description: "MRR from customers paying for the first time."
      - name: reactivation_mrr
        description: "MRR from customers who came back after leaving."
      - name: expansion_mrr
        description: "Extra MRR from existing customers who upgraded."
      - name: contraction_mrr
        description: "Lost MRR from customers who downgraded but still pay."
      - name: churned_mrr
        description: "Lost MRR from customers who stopped paying."
      - name: net_new_mrr
        description: "New + reactivation + expansion - contraction - churned MRR."
      - name: gross_revenue_retention
        description: "Share of last month's MRR kept after contraction and churn. Cannot exceed 1."
      - name: net_revenue_retention
        description: "Share of last month's MRR kept after contraction and churn, plus expansion. Above 1 means existing customers grew."
      - name: churned_customers
        description: "Customers whose MRR dropped to 0 this month."
      - name: logo_churn_rate
        description: "Churned customers divided by customers paying at the start of the month."