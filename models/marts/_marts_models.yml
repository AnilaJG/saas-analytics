version: 2

models:
  - name: dim_customers
    description: "One row per customer with profile details, lifetime billing totals and status as of the as_of_date."
    columns:
      - name: customer_id
        description: "Unique primary key for each customer."
        data_tests:
          - unique
          - not_null
      - name: company_name
        description: "Company name of the customer."
      - name: signup_date
        description: "Account creation date."
      - name: plan_tier
        description: "Plan tier chosen at signup."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Basic', 'Pro', 'Enterprise']
      - name: total_subscriptions
        description: "Number of subscriptions the customer has had."
      - name: lifetime_amount_due
        description: "Total amount billed across all of the customer's invoices."
      - name: lifetime_amount_paid
        description: "Total amount paid across all of the customer's invoices."
      - name: outstanding_balance
        description: "Lifetime amount due minus lifetime amount paid."
      - name: most_recent_payment_date
        description: "Date of the customer's most recent invoice with a payment."
      - name: customer_status
        description: "Status as of the as_of_date: active (has a running subscription), churned (had subscriptions, none running) or prospect (never subscribed)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'churned', 'prospect']

  - name: fct_invoices
    description: "One row per invoice with billing amounts, dates and payment status."
    columns:
      - name: invoice_id
        description: "Unique identifier for each invoice."
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        description: "Foreign key to the subscription the invoice belongs to."
        data_tests:
          - not_null
      - name: customer_id
        description: "Foreign key to dim_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: company_name
        description: "Name of the customer company."
      - name: plan_tier
        description: "Plan tier the customer chose at signup."
      - name: invoice_date
        description: "Date the invoice was issued."
        data_tests:
          - not_null
      - name: due_date
        description: "Date the invoice is due."
        data_tests:
          - not_null
      - name: amount_due
        description: "Amount billed on the invoice."
      - name: amount_paid
        description: "Amount paid on the invoice."
      - name: unpaid_balance
        description: "Amount due minus amount paid."
      - name: payment_status
        description: "paid (amount paid covers the amount due), partial (some of it paid) or unpaid (nothing paid, including failed payments)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid', 'partial', 'unpaid']

  - name: fct_mrr_monthly
    description: "One row per customer per month, from the customer's first paid month to the as_of_date. Month-end MRR and the movement that explains the change from the previous month."
    columns:
      - name: customer_id
        description: "Foreign key to dim_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: month_start_date
        description: "First day of the month."
        data_tests:
          - not_null
      - name: month_end_date
        description: "Last day of the month. MRR is measured on this day."
      - name: mrr
        description: "Monthly recurring revenue from subscriptions active on month_end_date."
        data_tests:
          - not_null
      - name: previous_mrr
        description: "MRR in the previous month (0 in a customer's first month)."
      - name: new_mrr
        description: "MRR from a customer paying for the first time."
      - name: reactivation_mrr
        description: "MRR from a customer who paid before, stopped, and came back."
      - name: expansion_mrr
        description: "Increase in MRR from a customer who paid in both months."
      - name: contraction_mrr
        description: "Decrease in MRR from a customer who still pays."
      - name: churned_mrr
        description: "Last month's MRR from a customer whose MRR dropped to 0."
      - name: is_paying
        description: "True when the customer has MRR above 0 in the month."

  - name: rpt_saas_metrics_monthly
    description: "One row per month with the main SaaS metrics: MRR, ARR, customers, MRR movements, retention and churn. Built from fct_mrr_monthly. Retention and churn rates are ratios, so 1.0 means 100%."
    columns:
      - name: month_start_date
        description: "First day of the month."
        data_tests:
          - unique
          - not_null
      - name: mrr
        description: "Monthly recurring revenue at the end of the month."
        data_tests:
          - not_null
      - name: arr
        description: "Annual recurring revenue (MRR x 12)."
      - name: paying_customers
        description: "Customers with MRR above 0 at the end of the month."
        data_tests:
          - not_null
      - name: arpa
        description: "Average revenue per paying customer (MRR / paying customers)."
      - name: new_mrr
        description: "MRR from customers paying for the first time."
      - name: reactivation_mrr
        description: "MRR from customers who came back after leaving."
      - name: expansion_mrr
        description: "Extra MRR from existing customers who upgraded."
      - name: contraction_mrr
        description: "Lost MRR from customers who downgraded but still pay."
      - name: churned_mrr
        description: "Lost MRR from customers who stopped paying."
      - name: net_new_mrr
        description: "New + reactivation + expansion - contraction - churned MRR."
      - name: gross_revenue_retention
        description: "Share of last month's MRR kept after contraction and churn. Cannot exceed 1."
      - name: net_revenue_retention
        description: "Share of last month's MRR kept after contraction and churn, plus expansion. Above 1 means existing customers grew."
      - name: churned_customers
        description: "Customers whose MRR dropped to 0 this month."
      - name: logo_churn_rate
        description: "Churned customers divided by customers paying at the start of the month."

  - name: rpt_cohort_retention
    description: "Customer retention by signup cohort. A cohort is the quarter in which customers first paid. One row per cohort and months since start. Early cohorts are small, so their rates swing a lot."
    columns:
      - name: cohort_quarter
        description: "First day of the quarter in which the customers first paid."
        data_tests:
          - not_null
      - name: months_since_start
        description: "Months since the customer's first paid month (0 is the first month)."
        data_tests:
          - not_null
      - name: customers_observed
        description: "Customers in the cohort whose history reaches this month."
      - name: customers_paying
        description: "Customers still paying in this month."
      - name: customer_retention_rate
        description: "customers_paying / customers_observed. 1.0 means 100%."