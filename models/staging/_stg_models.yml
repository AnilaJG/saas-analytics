version: 2
models:
  - name: stg_customers
    description: "Staging model for customer accounts. One row per business client."
    columns:
      - name: customer_id
        description: "Primary key for customers."
        data_tests:
          - unique
          - not_null
      - name: company_name
        description: "Registered business name of the customer."
        data_tests:
          - not_null
      - name: signup_date
        description: "Date when the customer account was created."
        data_tests:
          - not_null
      - name: plan_tier
        description: "Initial subscription plan tier chosen at signup."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Basic', 'Pro', 'Enterprise']

  - name: stg_subscriptions
    description: "Staging model for subscription contracts. One row per subscription."
    columns:
      - name: subscription_id
        description: "Primary key for subscriptions."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key referencing stg_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: mrr_amount
        description: "Monthly Recurring Revenue amount for the subscription."
        data_tests:
          - not_null
      - name: subscription_status
        description: "Subscription status: active or canceled."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'canceled']
      - name: billing_interval
        description: "Billing frequency for the subscription (e.g., monthly, annual)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['monthly', 'annual']
      - name: start_date
        description: "Date when the subscription became active."
        data_tests:
          - not_null
      - name: end_date
        description: "Date when the subscription was terminated or expired."

  - name: stg_invoices
    description: "Staging model for billing transactions. One row per invoice generated."
    columns:
      - name: invoice_id
        description: "Primary key for invoices."
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        description: "Foreign key referencing stg_subscriptions."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_subscriptions')
                field: subscription_id
      - name: customer_id
        description: "Foreign key referencing stg_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: amount_due
        description: "Total invoice amount billed."
      - name: amount_paid
        description: "Amount paid towards the invoice."
      - name: status
        description: "Payment status of the invoice."
      - name: invoice_date
        description: "Date when the invoice was issued."
      - name: due_date
        description: "Date when the invoice payment is due."