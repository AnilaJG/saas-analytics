models:
  - name: stg_customers
    description: "Staging model for customer accounts. One row per business client."
    columns:
      - name: customer_id
        description: "Primary key for customers."
        data_tests:
          - unique
          - not_null
      - name: company_name
        description: "Registered business name of the customer."
      - name: signup_date
        description: "Date when the customer account was created."
      - name: plan_tier
        description: "Initial subscription plan tier chosen at signup."

  - name: stg_subscriptions
    description: "Staging model for subscription contracts. One row per subscription."
    columns:
      - name: subscription_id
        description: "Primary key for subscriptions."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key referencing stg_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: plan_tier
        description: "Current active or historical subscription tier (e.g., Basic, Pro, Enterprise)."
      - name: status
        description: "Subscription status (e.g., active, cancelled, past_due)."
      - name: mrr
        description: "Monthly Recurring Revenue generated by the subscription."
      - name: created_at
        description: "Timestamp when the subscription started."
      - name: cancelled_at
        description: "Timestamp when the subscription was cancelled, if applicable."

  - name: stg_invoices
    description: "Staging model for billing transactions. One row per invoice generated."
    columns:
      - name: invoice_id
        description: "Primary key for invoices."
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        description: "Foreign key referencing stg_subscriptions."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_subscriptions')
                field: subscription_id
      - name: customer_id
        description: "Foreign key referencing stg_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: amount_due
        description: "Total invoice amount billed."
      - name: amount_paid
        description: "Amount paid towards the invoice."
      - name: status
        description: "Payment status of the invoice (e.g., paid, open, void)."
      - name: invoice_date
        description: "Date when the invoice was issued."
      - name: due_date
        description: "Date when the invoice payment is due."